name: tiko
description: Every use counts. A local-first prepaid usage tracker.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  drift: ^2.30.0
  drift_flutter: ^0.2.8
  intl: any
  uuid: ^4.5.1
  share_plus: ^12.0.0
  file_picker: ^10.0.0
  path_provider: ^2.1.5
  fl_chart: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.0
  drift_dev: ^2.30.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/tiko.png
